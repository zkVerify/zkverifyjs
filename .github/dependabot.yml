version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      polkadot:
        patterns:
          - "@polkadot/*"
          - "@polkadot-api/*"
      production-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Majors are ignored to keep routine churn down. Two consequences worth knowing:
    #  1. A fix that ships only in a new major never raises a PR, so it stays invisible
    #     here — run `npm audit` periodically rather than relying on Dependabot alone.
    #  2. Dependabot cannot touch anything pinned in the root `overrides` block. Those
    #     pins go stale silently: several had drifted into a vulnerable range by the
    #     time they were caught, and an override blocks `npm audit fix` too. Re-check
    #     each override against current advisories when auditing.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 14
