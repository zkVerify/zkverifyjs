name: CI Publish to NPM Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege by default: each job opts in to only what it needs.
permissions:
  contents: read

jobs:
  supply-chain-audit:
    # Host-runner companion to the containerized build-and-publish job.
    # harden-runner does not support container jobs, so this job re-runs the
    # most network-sensitive step (`npm ci`) on a bare runner with egress
    # auditing enabled. Publish correctness is owned by build-and-publish;
    # this job exists only to audit registry traffic.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies (audited)
        run: npm ci --ignore-scripts

  build-and-publish:
    # Only a `v*` tag may publish, including via workflow_dispatch.
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    # contents: write to create the GitHub Release; id-token: write for npm
    # trusted publishing (OIDC). Scoped to this job only.
    permissions:
      contents: write
      id-token: write
    container:
      image: node:24-bookworm
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Keep the token out of .git/config so no later step in this
          # privileged job can read it.
          persist-credentials: false

      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run build
        run: npm run build

      - name: Extract Package Version
        id: extract_version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Generate Release Notes
        id: generate_release_notes
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" == "tag" ]; then
            current_tag="${GITHUB_REF_NAME}"
          else
            current_tag="v${package_version}"
          fi

          if [[ "$current_tag" =~ ^v[0-9] ]]; then
            if [ "v${package_version}" != "$current_tag" ]; then
              echo "Error: package.json version (v${package_version}) and tag ($current_tag) mismatch"
              exit 1
            fi
          fi

          last_tag=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)

          if [ -z "$last_tag" ]; then
            echo "No previous tag found. Generating release notes for all history."
            git log --pretty=format:"* %s" > release_notes.md
          else
            echo "Generating release notes from $last_tag to $current_tag."
            git log --pretty=format:"* %s" "${last_tag}..${current_tag}" > release_notes.md
          fi

          sed -i 's/ (#\([0-9]*\))/ (PR #\1)/' release_notes.md

          echo "current_tag=$current_tag" >> "$GITHUB_ENV"

          # Release notes are built from commit subjects, which any PR author can
          # influence. Escape them with JSON.stringify so the value cannot break out
          # of the JSON string it is later embedded in (hand-rolled sed escaping
          # missed backslashes and control characters).
          RELEASE_NOTES_ESCAPED=$(node -e 'const fs=require("fs"); const s=fs.readFileSync("release_notes.md","utf8"); process.stdout.write(JSON.stringify(s).slice(1,-1));')
          echo "release_notes=$RELEASE_NOTES_ESCAPED" >> "$GITHUB_ENV"

      - name: Publish to npm
        id: publish
        run: npm publish --provenance --ignore-scripts

      - name: Generate SBOM (CycloneDX)
        if: ${{ steps.publish.outcome == 'success' }}
        # Runs the devDependency installed by `npm ci`, so the version and every
        # transitive dependency are locked with integrity hashes in package-lock.json.
        # An unpinned `npx --yes` would execute whatever the registry serves at that
        # moment inside this job, which holds the OIDC token and a repo-write
        # GITHUB_TOKEN.
        run: npm run sbom

      - name: Create GitHub Release
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Uses the REST API directly rather than installing the gh CLI at publish
        # time: that install trusted a GPG keyring fetched over the network with no
        # pinned fingerprint, in the job that produces the release artifact.
        run: |
          set -euo pipefail

          node -e '
            const fs = require("fs");
            process.stdout.write(JSON.stringify({
              tag_name: process.env.current_tag,
              name: `Release ${process.env.current_tag}`,
              body: fs.readFileSync("release_notes.md", "utf8"),
            }));
          ' > release_payload.json

          release_id=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" \
            --data @release_payload.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);if(!r.id)throw new Error("release creation failed: "+s);process.stdout.write(String(r.id));});')

          echo "Created release $current_tag (id $release_id)"

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @sbom.cyclonedx.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=sbom.cyclonedx.json" \
            > /dev/null

          echo "Attached sbom.cyclonedx.json to release $current_tag"

      - name: Send Slack Notification for Publish
        if: ${{ steps.publish.outcome == 'success' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.RELEASES_PROD_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*:tada:  :zk-logo-icon-square-black:  zkVerifyJS Package v${{ env.package_version }} Published  :zk-logo-icon-square-black:  :tada:*\n\n*Build URL:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view the build>\n\n*Published Package:* <https://www.npmjs.com/package/zkverifyjs/v/${{ env.package_version }}|zkverifyjs@${{ env.package_version }}>\n\n*Release Notes:*\n```${{ env.release_notes }}```"
                  }
                }
              ]
            }
