name: CI Publish to NPM Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  supply-chain-audit:
    # Host-runner companion to the containerized build-and-publish job.
    # harden-runner does not support container jobs, so this job re-runs the
    # most network-sensitive step (`npm ci`) on a bare runner with egress
    # auditing enabled. Publish correctness is owned by build-and-publish;
    # this job exists only to audit registry traffic.
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies (audited)
        run: npm ci --ignore-scripts

  build-and-publish:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install GitHub CLI
        run: |
          mkdir -p -m 755 /etc/apt/keyrings
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          apt-get install -y gh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run build
        run: npm run build

      - name: Extract Package Version
        id: extract_version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Generate Release Notes
        id: generate_release_notes
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" == "tag" ]; then
            current_tag="${GITHUB_REF_NAME}"
          else
            current_tag="v${package_version}"
          fi
          
          if [[ "$current_tag" =~ ^v[0-9] ]]; then
            if [ "v${package_version}" != "$current_tag" ]; then
              echo "Error: package.json version (v${package_version}) and tag ($current_tag) mismatch"
              exit 1
            fi
          fi
          
          last_tag=$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)

          if [ -z "$last_tag" ]; then
            echo "No previous tag found. Generating release notes for all history."
            git log --pretty=format:"* %s" > release_notes.md
          else
            echo "Generating release notes from $last_tag to $current_tag."
            git log --pretty=format:"* %s" "${last_tag}..${current_tag}" > release_notes.md
          fi

          sed -i 's/ (#\([0-9]*\))/ (PR #\1)/' release_notes.md

          echo "current_tag=$current_tag" >> "$GITHUB_ENV"
          RELEASE_NOTES=$(sed ':a;N;$!ba;s/\n/\\n/g' release_notes.md | sed 's/"/\\"/g')
          echo "release_notes=$RELEASE_NOTES" >> "$GITHUB_ENV"

      - name: Publish to npm
        id: publish
        run: npm publish --provenance --ignore-scripts

      - name: Generate SBOM (CycloneDX)
        if: ${{ steps.publish.outcome == 'success' }}
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --omit=dev \
            --ignore-npm-errors \
            --output-format=json \
            --output-file=sbom.cyclonedx.json

      - name: Create GitHub Release
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$current_tag" -F release_notes.md -t "Release $current_tag" sbom.cyclonedx.json

      - name: Send Slack Notification for Publish
        if: ${{ steps.publish.outcome == 'success' }}
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*:tada:  :zk-logo-icon-square-black:  zkVerifyJS Package v${{ env.package_version }} Published  :zk-logo-icon-square-black:  :tada:*\n\n*Build URL:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view the build>\n\n*Published Package:* <https://www.npmjs.com/package/zkverifyjs/v/${{ env.package_version }}|zkverifyjs@${{ env.package_version }}>\n\n*Release Notes:*\n```${{ env.release_notes }}```"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.RELEASES_PROD_SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK